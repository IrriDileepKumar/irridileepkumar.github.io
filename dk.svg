<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d935;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="12" fill="#0a0a0a"/>
  <rect x="2" y="2" width="96" height="96" rx="10" fill="none" stroke="url(#grad)" stroke-width="2"/>
  <text x="50" y="68" font-family="monospace" font-size="42" font-weight="bold" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">DK</text>
  <text x="50" y="85" font-family="monospace" font-size="10" fill="#00ff41" text-anchor="middle" opacity="0.7"> </text>
</svg>
